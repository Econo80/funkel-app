name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push cancels the running build, to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Validate content & strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_content.py
      - run: python3 scripts/check_strings.py

  web:
    name: Web app (test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # The iPhone/iPad build runs on macOS, which GitHub counts at 10x the minutes.
  # It only runs when started by hand (Actions → CI → Run workflow); the web
  # tests and content checks above run on every push.
  build-and-test:
    name: Build, test & screenshots (iOS Simulator)
    if: github.event_name == 'workflow_dispatch'
    needs: content
    # Set repo variable MAC_RUNNER=macos-15-intel when arm64 Macs are short; delete it to go back.
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick newest iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(key):
              return [int(n) for n in re.findall(r"\d+", key.split("iOS")[-1])]
          ios = sorted((k for k in devices if ".iOS-" in k), key=version, reverse=True)
          for runtime in ios:
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); print(runtime, phones[0]["name"], file=sys.stderr); break
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot simulator with a clean status bar
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          xcrun simctl status_bar "${{ steps.sim.outputs.udid }}" override \
            --time "9:41" --dataNetwork wifi --wifiBars 3 --cellularBars 4 \
            --batteryState charged --batteryLevel 100 || true

      # Unit tests run inside the host app, so a pass also proves the app launches.
      # The UI test walks the main screens and writes PNGs to ./screenshots.
      - name: Build and test
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project Funkel.xcodeproj \
            -scheme Funkel \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      # TestFlight ships Release; make sure it compiles (Debug-only test hooks excluded).
      - name: Release build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Funkel.xcodeproj \
            -scheme Funkel \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee -a xcodebuild.log | tail -n 5

      # iPad layout pass: reuses the simulator build, runs only the screen walk.
      - name: Pick newest iPad simulator
        id: ipad
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(key):
              return [int(n) for n in re.findall(r"\d+", key.split("iOS")[-1])]
          ios = sorted((k for k in devices if ".iOS-" in k), key=version, reverse=True)
          for runtime in ios:
              pads = [d for d in devices[runtime] if d["name"].startswith("iPad")]
              pads.sort(key=lambda d: (not d["name"].startswith("iPad Pro 13"), not d["name"].startswith("iPad Pro"), d["name"]))
              if pads:
                  print(pads[0]["udid"]); print(runtime, pads[0]["name"], file=sys.stderr); break
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: iPad screenshots
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots/ipad
        run: |
          set -o pipefail
          xcrun simctl boot "${{ steps.ipad.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.ipad.outputs.udid }}" -b
          xcrun simctl status_bar "${{ steps.ipad.outputs.udid }}" override \
            --time "9:41" --dataNetwork wifi --wifiBars 3 \
            --batteryState charged --batteryLevel 100 || true
          xcodebuild test \
            -project Funkel.xcodeproj \
            -scheme Funkel \
            -destination "id=${{ steps.ipad.outputs.udid }}" \
            -only-testing:FunkelUITests/ScreenshotTests/testCaptureMainScreens \
            -resultBundlePath TestResults-iPad.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee -a xcodebuild.log

      - name: Summarise errors
        if: failure()
        run: |
          echo "### Build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|failed|Failing tests|XCTAssert" xcodebuild.log | sort -u | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30
