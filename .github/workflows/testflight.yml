name: TestFlight

# Builds a signed Release and uploads it to App Store Connect / TestFlight.
# Run it by hand: Actions → TestFlight → Run workflow, or `gh workflow run testflight.yml`.
# One-time setup: docs/TESTFLIGHT.md.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive & upload to TestFlight
    # macOS 26 runners carry Xcode 27, which App Store Connect requires from April 2027.
    # Set repo variable MAC_RUNNER to another macOS 26 label when these are short; delete it to go back.
    runs-on: ${{ vars.MAC_RUNNER || 'macos-26' }}
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      # Unique, ever-increasing build number per upload.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      # App Store Connect requires the iOS 27 SDK (Xcode 27) or later from April 2027;
      # the runner's default Xcode can be older. Prefer a release over a beta.
      - name: Select the newest Xcode (27 once available)
        run: |
          # Newest release Xcode by its real version (folder names vary; betas are skipped).
          for app in /Applications/Xcode*.app; do
            case "$app" in *[Bb]eta*) continue ;; esac
            v=$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null) || continue
            echo "$v $app"
          done | sort -V | tee xcodes.txt
          read -r version xc < <(tail -n 1 xcodes.txt)
          major=${version%%.*}
          if [ -z "$xc" ] || [ "$major" -lt 26 ]; then
            echo "::error::No Xcode 26 or newer on this runner — App Store Connect would reject the build."
            exit 1
          fi
          if [ "$major" -lt 27 ]; then
            echo "::warning::Building with Xcode $version: Xcode 27 isn't on this runner yet. App Store Connect needs Xcode 27 from April 2027."
          fi
          sudo xcode-select -s "$xc"
          xcodebuild -version

      - name: Check configuration
        run: |
          missing=""
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID(variable)"
          [ -n "$BUNDLE_ID" ]     || missing="$missing BUNDLE_ID(variable)"
          [ -n "$ASC_KEY_ID" ]    || missing="$missing ASC_KEY_ID(secret)"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID(secret)"
          [ -n "$ASC_KEY_P8" ]    || missing="$missing ASC_KEY_P8(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing — see docs/TESTFLIGHT.md"
            exit 1
          fi

      - name: Validate content & strings
        run: |
          python3 scripts/validate_content.py
          python3 scripts/check_strings.py

      - name: Install App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Archive (Release, unsigned; signed on export)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Funkel.xcodeproj \
            -scheme Funkel \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Funkel.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee archive.log
          # Archived unsigned on purpose: signing while archiving needs a
          # development profile, which Apple only creates once a test device is
          # registered. The export step below signs for the App Store instead
          # (cloud-managed certificate + App Store profile, no device needed).

      - name: Export & upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Funkel.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log
          echo "### Uploaded build $BUILD_NUMBER to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in TestFlight after Apple finishes processing (usually 5–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Summarise errors
        if: failure()
        run: |
          echo "### Errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat archive.log export.log 2>/dev/null | grep -E "error:|Error|failed" | sort -u | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          retention-days: 7
